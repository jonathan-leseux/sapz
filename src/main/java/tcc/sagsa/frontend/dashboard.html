<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel - Sistema SAPZ SENAI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="badge-senai" style="margin: 0;">SENAI</span>
        <strong>Sistema SAPZ</strong>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-btn active" onclick="mostrarSecao('secao-dashboard', this)">Dashboard</button>
        <button class="nav-btn" onclick="mostrarSecao('secao-escolas', this)">Escolas / Unidades</button>
        <button class="nav-btn" onclick="mostrarSecao('secao-sapz', this)">Situações de Aprendizagem</button>
      </nav>

      <div class="sidebar-footer">
        <p id="usuario-logado" style="font-size: 0.8rem; margin-bottom: 0.75rem; color: #cbd5e1;"></p>
        <button class="btn btn-danger" onclick="logout()">Sair do Sistema</button>
      </div>
    </aside>

    <main class="main-content">
      <!-- SEÇÃO 1: DASHBOARD -->
      <section id="secao-dashboard">
        <h2>Painel Geral - Metodologia SENAI</h2>
        <div class="grid-stats">
          <div class="stat-box">
            <h3>Unidades Escolares</h3>
            <p id="stat-escolas">0</p>
          </div>
          <div class="stat-box" style="border-left-color: #059669;">
            <h3>Cursos Ativos</h3>
            <p id="stat-cursos">0</p>
          </div>
          <div class="stat-box" style="border-left-color: #d97706;">
            <h3>Turmas Cadastradas</h3>
            <p id="stat-turmas">0</p>
          </div>
          <div class="stat-box" style="border-left-color: #E30613;">
            <h3>SAPZs Criadas</h3>
            <p id="stat-sapzs">0</p>
          </div>
        </div>
      </section>

      <!-- SEÇÃO 2: ESCOLAS -->
      <section id="secao-escolas" class="hidden">
        <h2 style="margin-bottom: 1rem;">Unidades Escolares SENAI</h2>

        <div class="card">
          <form id="form-escola" class="grid-form">
            <input type="hidden" id="escola-id" />
            <div class="form-group">
              <label>Nome da Escola</label>
              <input type="text" id="escola-nome" placeholder="Ex: SENAI Visconde de Mauá" required />
            </div>
            <div class="form-group">
              <label>Código Unidade</label>
              <input type="text" id="escola-codigo" placeholder="Ex: UN-102" />
            </div>
            <div class="form-group">
              <label>Cidade</label>
              <input type="text" id="escola-cidade" placeholder="São Leopoldo" required />
            </div>
            <div class="form-group">
              <label>Estado (UF)</label>
              <input type="text" id="escola-estado" value="RS" maxlength="2" required />
            </div>
            <div class="form-group" style="display: flex; align-items: flex-end;">
              <button type="submit" class="btn btn-primary" style="width: 100%;">Salvar Escola</button>
            </div>
          </form>
        </div>

        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>Cidade / UF</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-escolas"></tbody>
          </table>
        </div>
      </section>

      <!-- SEÇÃO 3: SITUAÇÕES DE APRENDIZAGEM -->
      <section id="secao-sapz" class="hidden">
        <h2 style="margin-bottom: 1rem;">Situações de Aprendizagem (SAPZ)</h2>

        <div class="card">
          <form id="form-sapz">
            <div class="grid-form">
              <div class="form-group">
                <label>Título da SAPZ</label>
                <input type="text" id="sapz-titulo" required />
              </div>
              <div class="form-group">
                <label>Estratégia Didática</label>
                <select id="sapz-estrategia">
                  <option value="SITUACAO_PROBLEMA">Situação-Problema</option>
                  <option value="ESTUDO_CASO">Estudo de Caso</option>
                  <option value="PROJETO">Projeto</option>
                  <option value="PESQUISA_APLICADA">Pesquisa Aplicada</option>
                  <option value="PROJETO_INTEGRADOR">Projeto Integrador</option>
                </select>
              </div>
              <div class="form-group">
                <label>Unidade Curricular</label>
                <select id="sapz-uc" required></select>
              </div>
              <div class="form-group">
                <label>Carga Horária (h)</label>
                <input type="number" id="sapz-ch" value="40" min="1" required />
              </div>
            </div>

            <div class="grid-form">
              <div class="form-group">
                <label>Contextualização</label>
                <textarea id="sapz-contexto" rows="3" required></textarea>
              </div>
              <div class="form-group">
                <label>Desafio</label>
                <textarea id="sapz-desafio" rows="3" required></textarea>
              </div>
              <div class="form-group">
                <label>Resultados Esperados</label>
                <textarea id="sapz-resultados" rows="3" required></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-primary">Cadastrar SAPZ</button>
          </form>
        </div>

        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Título</th>
                <th>Estratégia</th>
                <th>Carga Horária</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-sapz"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
